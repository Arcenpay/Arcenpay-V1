services:
  facilitator:
    build:
      context: ../..
      dockerfile: apps/facilitator/Dockerfile
    container_name: meap-facilitator
    ports:
      - '3402:3402'
    environment:
      - PORT=3402
      - NODE_ENV=production
      - RPC_URL=${RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      - CHAIN_ID=${CHAIN_ID:-84532}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - X402_ENABLE_SETTLEMENT=true
      - X402_REQUIRE_SETTLER_AUTH=true
      - REDIS_URL=redis://redis:6379
      - SESSION_VAULT_ADDRESS=${SESSION_VAULT_ADDRESS:-0x2dccEaad8551a620E4Fc736bb4d0fbb8D1A17D7C}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:3402/health']
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: meap-facilitator-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
