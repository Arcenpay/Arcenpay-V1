version: '3.8'

services:
  facilitator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meap-facilitator
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DEPLOYER_PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      - CHAIN_ID=11155111
      # Contract addresses (Sepolia)
      - PLAN_FACTORY_ADDRESS=0xc736f5d91aC0039b97A4Fc3540B8f3d59E7FdBa6
      - FEE_COLLECTOR_ADDRESS=0x513fab5218045790364b33A38D95FE8E17403BAe
      - SUBSCRIPTION_REGISTRY_ADDRESS=0xf45A9E5280F72260a713c50b0Ca4e4FB1e22Cc8A
      - SESSION_VAULT_ADDRESS=0x2dccEaad8551a620E4Fc736bb4d0fbb8D1A17D7C
      - ZK_USAGE_VERIFIER_ADDRESS=0x265E0dC80b00044d183AFa83237F5976bB4d585c
      - AUTOPAY_MODULE_ADDRESS=0x3f3734fb45D1511c23384D18Eb1927492E5e3764
      - MIRROR_REGISTRY_ADDRESS=0x05BdaB1b4A87a4a5DF3Af1Ebb9Da853A0d31592E
      - USDC_ADDRESS=0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
