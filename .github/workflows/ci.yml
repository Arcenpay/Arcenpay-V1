name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  #  Repo Hygiene — Zero Unfinished Markers Gate
  # ============================================================
  hygiene:
    name: Unfinished Work Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for unfinished markers
        run: bash scripts/check-unfinished.sh

  # ============================================================
  #  Smart Contract Tests (Foundry)
  # ============================================================
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node dependencies
        run: npm ci

      - name: Compile contracts (Hardhat)
        run: npm run -w packages/contracts build

      - name: Run Foundry tests
        run: npm run -w packages/contracts test:forge:docker

      - name: Check contract sizes
        run: npm run -w packages/contracts forge:build:docker

      - name: Coverage summary
        run: npm run -w packages/contracts forge:coverage:docker

      - name: Gas snapshot check
        run: npm run -w packages/contracts forge:snapshot:docker

  # ============================================================
  #  SDK Build & Type Check
  # ============================================================
  launch:
    name: Launch Surfaces
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build launch surfaces
        run: npm run build:launch

      - name: Type check launch surfaces
        run: npm run typecheck:launch

      - name: Test launch surfaces
        run: npm run test:launch

  # ============================================================
  #  Lint
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

      - name: Turbo lint (launch surfaces)
        run: npm run lint:launch

  # ============================================================
  #  Static Analysis — Slither
  # ============================================================
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        working-directory: packages/contracts
        run: |
          slither . \
            --config-file slither.config.json \
            --fail-on high \
            --json slither-report.json \
            --sarif slither-report.sarif

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            packages/contracts/slither-report.json
            packages/contracts/slither-report.sarif

  # ============================================================
  #  Subgraph Build & Codegen
  # ============================================================
  subgraph:
    name: Subgraph CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Subgraph codegen
        working-directory: subgraph
        run: npx graph codegen

      - name: Subgraph build
        working-directory: subgraph
        run: npx graph build
