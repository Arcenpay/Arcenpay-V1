name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@arcenpay/internal-core
          npm run build --workspace=@arcenpay/shared-types

      - name: Verify vendored internal/core copies are in sync
        run: npm run check:core-sync

      - name: Typecheck SDK packages
        run: |
          npm run typecheck --workspace=@arcenpay/node
          npm run typecheck --workspace=@arcenpay/react

      - name: Run SDK tests
        run: |
          npm run test --workspace=@arcenpay/node
          npm run test --workspace=@arcenpay/react

      - name: Build SDK packages
        run: |
          npm run build --workspace=@arcenpay/node
          npm run build --workspace=@arcenpay/react

  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for unfinished work markers
        run: bash scripts/check-unfinished.sh
