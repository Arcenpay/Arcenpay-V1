name: Contracts CI/CD

on:
  push:
    paths:
      - 'packages/contracts/**'
      - 'packages/sdk-core/src/addresses.ts'
  pull_request:
    paths:
      - 'packages/contracts/**'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'sepolia'
        type: choice
        options:
          - sepolia
          - base-sepolia
          - base-mainnet

env:
  HARDHAT_DISABLE_TELEMETRY_PROMPT: 'true'

jobs:
  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test & Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (Hardhat)
        run: npm run -w packages/contracts build

      - name: Forge Build
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: forge build
        run: |
          cd packages/contracts
          forge build --sizes

      - name: forge test
        run: |
          cd packages/contracts
          forge test -vvv

      - name: forge coverage
        run: |
          cd packages/contracts
          forge coverage --report summary

      - name: forge gas snapshot
        run: |
          cd packages/contracts
          forge snapshot --check || echo "Gas snapshot changed — review gas-snapshot.txt"

      - name: Hardhat tests
        run: npm run -w packages/contracts test:hardhat

      - name: TypeScript typecheck
        run: npm run -w packages/contracts typecheck

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy-sepolia:
    name: Deploy → Sepolia
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on manual dispatch or push to main/deploy branches
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'sepolia' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy/')))
    environment: sepolia

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run -w packages/contracts build

      - name: Deploy to Sepolia
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: npm run -w packages/contracts deploy:sepolia

      - name: Export environment manifest
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY_SEPOLIA }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: npm run -w packages/contracts deploy:export-manifest

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-deployment-${{ github.sha }}
          path: |
            packages/contracts/deployments/
            packages/contracts/environment-manifest.json
          retention-days: 90

      - name: Verify contracts on Etherscan
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          cd packages/contracts
          # Verify all deployed contracts using Hardhat verify
          npx hardhat verify --network sepolia --list-files || true
        continue-on-error: true

  deploy-base-sepolia:
    name: Deploy → Base Sepolia
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'base-sepolia'
    environment: base-sepolia

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run -w packages/contracts build

      - name: Deploy to Base Sepolia
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY_BASE_SEPOLIA }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: npm run -w packages/contracts deploy:base-sepolia

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-sepolia-deployment-${{ github.sha }}
          path: |
            packages/contracts/deployments/
            packages/contracts/environment-manifest.json
          retention-days: 90

      - name: Verify contracts on Basescan
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: |
          cd packages/contracts
          npx hardhat verify --network baseSepolia --list-files || true
        continue-on-error: true

  deploy-base-mainnet:
    name: Deploy → Base Mainnet
    needs: test
    runs-on: ubuntu-latest
    # Mainnet deploys ONLY via manual dispatch — never on auto-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.network == 'base-mainnet'
    environment: base-mainnet  # Requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run -w packages/contracts build

      - name: Deploy to Base Mainnet
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: npm run -w packages/contracts deploy:base-mainnet

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-mainnet-deployment-${{ github.sha }}
          path: |
            packages/contracts/deployments/
            packages/contracts/environment-manifest.json
          retention-days: 365  # Keep mainnet artifacts for a year

      - name: Verify contracts on Basescan (mainnet)
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
        run: |
          cd packages/contracts
          npx hardhat verify --network baseMainnet --list-files || true
        continue-on-error: true

      - name: Run smoke tests on mainnet
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
        run: npm run -w packages/contracts smoke:base-mainnet
        continue-on-error: true
