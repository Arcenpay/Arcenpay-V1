name: Contracts CI

on:
  push:
    paths:
      - 'packages/contracts/**'
  pull_request:
    paths:
      - 'packages/contracts/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (Hardhat)
        run: npm run -w packages/contracts build

      - name: Forge Build
        run: npm run -w packages/contracts forge:build:docker

      - name: Forge Test
        run: npm run -w packages/contracts test:forge:docker

      - name: Forge Coverage
        run: npm run -w packages/contracts forge:coverage:docker

      - name: Forge Gas Snapshot
        run: npm run -w packages/contracts forge:snapshot:docker
