name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-*/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/sdk-*/**"

jobs:
  sdk:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx turbo run typecheck --filter="./packages/sdk-*"

      - name: Build all SDKs
        run: npx turbo run build --filter="./packages/sdk-*"

      - name: Run tests
        run: npx turbo run test --filter="./packages/sdk-*"

      - name: Check bundle sizes
        run: |
          echo "=== SDK Bundle Sizes ==="
          for pkg in sdk-core sdk-node sdk-react sdk-agent; do
            if [ -d "packages/$pkg/dist" ]; then
              echo "$pkg: $(du -sh packages/$pkg/dist/ | cut -f1)"
            fi
          done
