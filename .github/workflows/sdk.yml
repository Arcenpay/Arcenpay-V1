name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-node/**"
      - "packages/sdk-react/**"
      - "packages/sdk-agent/**"
      - "packages/internal-core/**"
      - "scripts/sync-internal-core.mjs"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches: [main]
    paths:
      - "packages/sdk-node/**"
      - "packages/sdk-react/**"
      - "packages/sdk-agent/**"
      - "packages/internal-core/**"
      - "scripts/sync-internal-core.mjs"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

jobs:
  sdk:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck SDK packages
        run: |
          npm run typecheck --workspace=@arcenpay/node
          npm run typecheck --workspace=@arcenpay/react
          npm run typecheck --workspace=@arcenpay/agent

      - name: Build all SDKs
        run: |
          npm run build --workspace=@arcenpay/node
          npm run build --workspace=@arcenpay/react
          npm run build --workspace=@arcenpay/agent

      - name: Run SDK tests
        run: |
          npm run test --workspace=@arcenpay/node
          npm run test --workspace=@arcenpay/react
          npm run test --workspace=@arcenpay/agent

      - name: Check bundle sizes
        run: |
          echo "=== SDK Bundle Sizes ==="
          for pkg in sdk-node sdk-react sdk-agent; do
            if [ -d "packages/$pkg/dist" ]; then
              echo "$pkg: $(du -sh packages/$pkg/dist/ | cut -f1)"
            fi
          done
