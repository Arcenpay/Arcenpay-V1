name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - "packages/sdk-node/**"
      - "packages/sdk-react/**"
      - "packages/sdk-agent/**"
      - "packages/internal-core/**"
      - "scripts/sync-internal-core.mjs"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches: [main]
    paths:
      - "packages/sdk-node/**"
      - "packages/sdk-react/**"
      - "packages/sdk-agent/**"
      - "packages/internal-core/**"
      - "scripts/sync-internal-core.mjs"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

jobs:
  sdk:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build internal-core (dependency for all SDKs)
        run: npm run build --workspace=@arcenpay/internal-core

      - name: Typecheck SDK packages
        run: |
          npm run typecheck --workspace=@arcenpay/node
          npm run typecheck --workspace=@arcenpay/react
          npm run typecheck --workspace=@arcenpay/agent

      - name: Build all SDKs
        run: |
          npm run build --workspace=@arcenpay/node
          npm run build --workspace=@arcenpay/react
          npm run build --workspace=@arcenpay/agent

      - name: Run SDK tests
        run: |
          npm run test --workspace=@arcenpay/node
          npm run test --workspace=@arcenpay/react
          npm run test --workspace=@arcenpay/agent

      - name: Check bundle sizes
        run: |
          echo "=== SDK Bundle Sizes ==="
          # Runtime dependencies must stay external (see
          # packages/sdk-react/tsup.config.ts). This catches a regression like
          # @arcenpay/react 1.2.0, whose 24 MB tarball bundled wagmi/viem/ethers.
          limit_kb=5120
          failed=0
          for pkg in sdk-node sdk-react sdk-agent; do
            if [ -d "packages/$pkg/dist" ]; then
              kb=$(du -sk "packages/$pkg/dist" | cut -f1)
              echo "$pkg: ${kb} KB"
              if [ "$kb" -gt "$limit_kb" ]; then
                echo "::error::$pkg dist is ${kb} KB (limit ${limit_kb} KB); keep dependencies external."
                failed=1
              fi
            fi
          done
          exit $failed
