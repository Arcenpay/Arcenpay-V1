name: Dashboard CI

on:
  push:
    branches: [main, nishar-end]
    paths:
      - 'apps/arcen-dashboard/**'
      - 'packages/sdk-core/**'
      - 'packages/sdk-react/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/arcen-dashboard/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/arcen-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID || 'ci-placeholder' }}
          NEXT_PUBLIC_CHAIN_ID: '11155111'
          NEXT_PUBLIC_GRAPH_URL: ${{ secrets.GRAPH_URL || '' }}
          NEXT_PUBLIC_FACILITATOR_BASE_URL: 'http://localhost:3402'
          SIWE_JWT_SECRET: 'ci-dev-secret'
