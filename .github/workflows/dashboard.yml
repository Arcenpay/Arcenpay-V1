name: Dashboard & Docs CI

on:
  push:
    branches: [main]
    paths:
      - "apps/arcen-dashboard/**"
      - "apps/arcenpay-docs/**"
      - "packages/internal-core/**"
      - "packages/shared-types/**"
      - "packages/sdk-react/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/arcen-dashboard/**"
      - "apps/arcenpay-docs/**"
      - "packages/internal-core/**"
      - "packages/shared-types/**"
      - "packages/sdk-react/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

jobs:
  dashboard:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      SIWE_JWT_SECRET: ci-dev-secret
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_CHAIN_ID: "11155111"
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard dependencies
        run: |
          npm run build --workspace=@arcenpay/internal-core
          npm run build --workspace=@arcenpay/react

      - name: Typecheck dashboard
        run: npm run typecheck --workspace=@arcenpay/dashboard

      - name: Run dashboard tests
        run: npm run test --workspace=@arcenpay/dashboard

      - name: Build dashboard
        run: npm run build --workspace=@arcenpay/dashboard
        env:
          SKIP_ENV_VALIDATION: "true"
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  docs:
    name: Validate Docs
    if: ${{ hashFiles('apps/arcenpay-docs/docs.json') != '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Mintlify docs
        working-directory: apps/arcenpay-docs
        run: npx mint@latest validate

      - name: Check docs links
        working-directory: apps/arcenpay-docs
        run: npx mint@latest broken-links
