name: Facilitator CI

on:
  push:
    branches: [main]
    paths:
      - "apps/facilitator/**"
      - "packages/sdk-core/**"
      - "packages/sdk-node/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/facilitator/**"
      - "packages/sdk-core/**"
      - "packages/sdk-node/**"

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK dependencies
        run: npx turbo run build --filter="./packages/sdk-core" --filter="./packages/sdk-node"

      - name: TypeScript check
        run: cd apps/facilitator && npx tsc --noEmit

      - name: Run tests
        run: cd apps/facilitator && npm run test --if-present || echo "No test script configured"

      - name: Build facilitator
        run: cd apps/facilitator && npm run build

  docker:
    name: Docker Build
    needs: build
    if: github.ref == "refs/heads/main"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t arcenpay/facilitator:latest apps/facilitator

      - name: Docker image size
        run: docker images arcenpay/facilitator:latest --format "{{.Size}}"
