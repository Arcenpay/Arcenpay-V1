name: Facilitator CI

on:
  push:
    branches: [main]
    paths:
      - "apps/facilitator/**"
      - "packages/internal-core/**"
      - "packages/sdk-node/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/facilitator/**"
      - "packages/internal-core/**"
      - "packages/sdk-node/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build facilitator dependencies
        run: |
          npm run build --workspace=@arcenpay/internal-core
          npm run build --workspace=@arcenpay/node

      - name: Typecheck facilitator
        run: npm run typecheck --workspace=@arcenpay/facilitator

      - name: Run facilitator tests
        run: npm run test --workspace=@arcenpay/facilitator

      - name: Build facilitator
        run: npm run build --workspace=@arcenpay/facilitator
