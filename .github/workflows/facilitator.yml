name: Facilitator CI

on:
  push:
    paths:
      - 'apps/facilitator/**'
  pull_request:
    paths:
      - 'apps/facilitator/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npx turbo run build --filter='./packages/*'

      - name: TypeScript check
        run: cd apps/facilitator && npx tsc --noEmit

      - name: Build facilitator
        run: cd apps/facilitator && npm run build

  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t arcenpay/facilitator:latest apps/facilitator

      - name: Docker image size
        run: docker images arcenpay/facilitator:latest --format "{{.Size}}"
