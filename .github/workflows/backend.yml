name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/arcen-backend/**"
      - "packages/internal-core/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/arcen-backend/**"
      - "packages/internal-core/**"
      - "packages/shared-types/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

jobs:
  backend:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      SIWE_JWT_SECRET: ci-dev-secret
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck --workspace=@arcenpay/backend

      - name: Run backend tests
        run: npm run test --workspace=@arcenpay/backend

      - name: Build backend
        run: npm run build --workspace=@arcenpay/backend
