specVersion: 0.0.5
description: MEAP + ZKVUB Protocol — Subscription and Usage Billing Indexer
repository: https://github.com/arcenpay/arcenpay

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: SubscriptionRegistry
    network: sepolia
    source:
      address: "0xf45A9E5280F72260a713c50b0Ca4e4FB1e22Cc8A"
      abi: SubscriptionRegistry
      startBlock: 7500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Subscription
        - Plan
        - Subscriber
        - BillingEvent
      abis:
        - name: SubscriptionRegistry
          file: ./abis/SubscriptionRegistry.json
      eventHandlers:
        - event: SubscriptionMinted(indexed address,indexed uint256,indexed uint256,uint64)
          handler: handleSubscriptionMinted
        - event: SubscriptionRenewed(indexed uint256,uint64,uint256)
          handler: handleSubscriptionRenewed
        - event: SubscriptionCancelled(indexed uint256)
          handler: handleSubscriptionCancelled
      file: ./src/subscription-registry.ts

  - kind: ethereum
    name: PlanFactory
    network: sepolia
    source:
      address: "0xc736f5d91aC0039b97A4Fc3540B8f3d59E7FdBa6"
      abi: PlanFactory
      startBlock: 7500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Provider
        - Plan
      abis:
        - name: PlanFactory
          file: ./abis/PlanFactory.json
      eventHandlers:
        - event: ProviderRegistered(indexed address)
          handler: handleProviderRegistered
        - event: PlanCreated(indexed uint256,indexed address,string,uint256,uint32)
          handler: handlePlanCreated
        - event: PlanUpdated(indexed uint256)
          handler: handlePlanUpdated
        - event: PlanDeactivated(indexed uint256)
          handler: handlePlanDeactivated
      file: ./src/plan-factory.ts

  - kind: ethereum
    name: SessionVault
    network: sepolia
    source:
      address: "0x2dccEaad8551a620E4Fc736bb4d0fbb8D1A17D7C"
      abi: SessionVault
      startBlock: 7500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Session
        - FundEvent
        - BillingEvent
      abis:
        - name: SessionVault
          file: ./abis/SessionVault.json
      eventHandlers:
        - event: SessionFunded(indexed address,indexed bytes32,uint256,address)
          handler: handleSessionFunded
        - event: SessionWithdrawn(indexed bytes32,uint256,indexed address)
          handler: handleSessionWithdrawn
        - event: SessionSettled(indexed bytes32,uint256,indexed address)
          handler: handleSessionSettled
      file: ./src/session-vault.ts

  - kind: ethereum
    name: ZKUsageVerifier
    network: sepolia
    source:
      address: "0x265E0dC80b00044d183AFa83237F5976bB4d585c"
      abi: ZKUsageVerifier
      startBlock: 7500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Settlement
        - ProofSubmission
        - BillingEvent
      abis:
        - name: ZKUsageVerifier
          file: ./abis/ZKUsageVerifier.json
      eventHandlers:
        - event: BillingSettled(indexed bytes32,indexed bytes32,uint256,uint256,uint64,uint64)
          handler: handleBillingSettled
      file: ./src/zk-usage-verifier.ts

  - kind: ethereum
    name: FeeCollector
    network: sepolia
    source:
      address: "0x513fab5218045790364b33A38D95FE8E17403BAe"
      abi: FeeCollector
      startBlock: 7500000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - FeeEvent
        - BillingEvent
        - ProviderTierChange
      abis:
        - name: FeeCollector
          file: ./abis/FeeCollector.json
      eventHandlers:
        - event: FeeCollected(indexed address,uint256,uint256,string)
          handler: handleFeeCollected
        - event: ProviderTierSynced(indexed address,uint8,uint256,uint256)
          handler: handleProviderTierSynced
        - event: ProviderFeeRateSet(indexed address,uint256,uint256)
          handler: handleProviderFeeRateSet
      file: ./src/fee-collector.ts
