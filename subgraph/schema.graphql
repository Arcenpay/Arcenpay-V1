# MEAP + ZKVUB Protocol — Subgraph Schema

type Provider @entity(immutable: false) {
  id: ID! # provider wallet
  wallet: Bytes!
  createdAt: BigInt!
  planCount: Int!
  totalRevenue: BigInt!
}

type Subscriber @entity(immutable: false) {
  id: ID! # subscriber wallet
  wallet: Bytes!
  activeSubscriptionCount: Int!
  totalPaid: BigInt!
  lastUpdated: BigInt!
}

type Subscription @entity(immutable: false) {
  id: ID! # tokenId
  subscriber: Bytes!
  plan: Plan!
  expiration: BigInt!
  isActive: Boolean!
  mintedAt: BigInt!
  renewedAt: BigInt
  cancelledAt: BigInt
  amountPaid: BigInt!
  txHash: Bytes!
  blockNumber: BigInt!
}

type Plan @entity(immutable: false) {
  id: ID! # planId
  provider: Bytes!
  name: String!
  tier: String!
  price: BigInt!
  billingInterval: BigInt!
  acceptedToken: Bytes
  active: Boolean!
  createdAt: BigInt!
  subscriberCount: Int!
}

type Session @entity(immutable: false) {
  id: ID! # sessionId
  agent: Bytes!
  totalFunded: BigInt!
  totalWithdrawn: BigInt!
  totalSettled: BigInt!
  currentBalance: BigInt!
  fundEvents: [FundEvent!]! @derivedFrom(field: "session")
  settlements: [Settlement!]! @derivedFrom(field: "session")
}

type FundEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  session: Session!
  amount: BigInt!
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  eventType: String! # funded | withdrawn
}

type Settlement @entity(immutable: true) {
  id: ID! # txHash-logIndex
  session: Session!
  sessionId: Bytes!
  agentAddress: Bytes!
  callCount: BigInt!
  settlementAmount: BigInt!
  windowStart: BigInt!
  windowEnd: BigInt!
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type ProofSubmission @entity(immutable: true) {
  id: ID! # sessionId-windowEnd
  sessionId: Bytes!
  agentAddress: Bytes!
  callCount: BigInt!
  settlementAmount: BigInt!
  windowStart: BigInt!
  windowEnd: BigInt!
  txHash: Bytes!
  timestamp: BigInt!
}

type BillingEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  eventType: String!
  tokenId: BigInt
  planId: BigInt
  sessionId: Bytes
  amount: BigInt
  actor: Bytes
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type FeeEvent @entity(immutable: true) {
  id: ID! # txHash-logIndex
  collector: Bytes!
  grossAmount: BigInt!
  feeAmount: BigInt!
  feeType: String!
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# Protocol-wide aggregates
type ProtocolStats @entity(immutable: false) {
  id: ID! # global
  totalSubscriptions: Int!
  activeSubscriptions: Int!
  totalPlans: Int!
  totalRevenue: BigInt!
  totalSettlements: Int!
  totalSettlementVolume: BigInt!
  totalSessionsFunded: BigInt!
}
