[workspace]
resolver = "2"
members = [
    "common",
    "contracts/flag-registry",
    "contracts/plan-factory",
    "contracts/fee-collector",
    "contracts/session-vault",
    "contracts/subscription-registry",
    "contracts/autopay-account",
    "contracts/usage-verifier",
    "contracts/mirror-registry",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
soroban-sdk = { version = "27", features = ["alloc"] }
arcenpay-common = { path = "common" }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
