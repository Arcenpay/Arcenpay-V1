[tools]
anchor = "0.30.1"

[features]
default = []
mainnet = ["arcenpay-solana/mainnet"]
devnet = ["arcenpay-solana/devnet"]

[programs.localnet]
arcenpay_solana = "D4ECHyomENvFHrdXWHcRncTwwQ1EQbyY4ga3CkcaYCP3"

[programs.devnet]
arcenpay_solana = "D4ECHyomENvFHrdXWHcRncTwwQ1EQbyY4ga3CkcaYCP3"

# The same program id serves every cluster: localnet, Devnet, and Mainnet-beta
# are all deployed at D4ECHyomENvFHrdXWHcRncTwwQ1EQbyY4ga3CkcaYCP3. If the
# program keypair is ever regenerated, run `anchor keys sync` and mirror the new
# id into packages/internal-core/src/addresses.ts (SOLANA_* entries) and the
# ARCENPAY_CONTRACT_<chainId>_* env vars.
[programs.mainnet]
arcenpay_solana = "D4ECHyomENvFHrdXWHcRncTwwQ1EQbyY4ga3CkcaYCP3"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
